<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:C</title>
</head>
<body>
    <h1 style="text-align: center;">TALK TO KAYLA SIMULATOR</h1>

    <div style="display: flex; justify-content: center; align-items: flex-end;">
        <img src="face.webp" width="500" height="500" style="display: block;">

        <div style="position: relative; margin-left: 30px; margin-bottom: 140px;">
            <img src="bubble.webp" width="400" height="300" style="display: block;">

            <div id="messageResult"
     style="position: absolute; top: 110px; left: 40px; width: 300px;
            font-size: 1.3em; text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.2;">
</div>
        </div>
    </div>

    <div style="text-align:center; margin-top:50px;">
        <input id="messageInput" placeholder="Enter your message"
               style="display: block; margin-left: auto; margin-right: auto; width: 400px; height: 40px; font-size: 1.2em;">
    </div>

    <script>
    const responses = ["idkkkkkk", "huh", "whattt", "Tôi không biết", "okay what", "you don't love me :(", "hiii", "uhhh", "Your mean", 
    "STOPP", "I hate you", "uh huh!", "I HATE MY BOYFRIEND >:(", "I DON'T CARE ABOUT MY BOYFRIEND", "I HATE YOU", "I HATE TALKING TO HIM", 
    "OMG", ":)", "I think I should talk to my boyfriend more!", "I don't actaully like hanging out with him, he so annoying.", "I think I love him"];
    const input = document.getElementById('messageInput');
    const resultDiv = document.getElementById('messageResult');

    let lastResponse = null; // store previous response

    input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const userText = input.value.trim();

            // don't respond if empty
            if (userText === '') return;

            let randomResponse;

            // keep picking until it's different from last one
            do {
                randomResponse = responses[Math.floor(Math.random() * responses.length)];
            } while (randomResponse === lastResponse && responses.length > 1);

            lastResponse = randomResponse;

            resultDiv.textContent = randomResponse;
            input.value = '';
        }
    });
    </script>
</body>
</html>
